name: Release & Container Distribution

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  build-and-publish:
    name: Build & Publish to GHCR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Clean Image Names
        id: image-names
        run: |
          # Ensure lowercase repository string for Docker image naming compatibility
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          VERSION_TAG=${GITHUB_REF_NAME#v}
          echo "web_image=ghcr.io/${REPO_LOWER}-web" >> $GITHUB_OUTPUT
          echo "collab_image=ghcr.io/${REPO_LOWER}-collab" >> $GITHUB_OUTPUT
          echo "version=${VERSION_TAG}" >> $GITHUB_OUTPUT

      # ------------------------------------------------------------------------
      # 1. Build & Push Web Application Container
      # ------------------------------------------------------------------------
      - name: Build and Push Web Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ steps.image-names.outputs.web_image }}:${{ steps.image-names.outputs.version }}
            ${{ steps.image-names.outputs.web_image }}:${{ github.ref_name }}
            ${{ steps.image-names.outputs.web_image }}:latest
          build-args: |
            NEXT_PUBLIC_APP_URL=http://localhost:3000
            NEXT_PUBLIC_COLLAB_SERVER_URL=http://localhost:4000
            NEXT_PUBLIC_COLLAB_WS_URL=ws://localhost:4000

      # ------------------------------------------------------------------------
      # 2. Build & Push Collaboration Server Container
      # ------------------------------------------------------------------------
      - name: Build and Push Collab Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/collab-server/Dockerfile
          push: true
          tags: |
            ${{ steps.image-names.outputs.collab_image }}:${{ steps.image-names.outputs.version }}
            ${{ steps.image-names.outputs.collab_image }}:${{ github.ref_name }}
            ${{ steps.image-names.outputs.collab_image }}:latest

      # ------------------------------------------------------------------------
      # 3. Create Official GitHub Release with Asset Bundle
      # ------------------------------------------------------------------------
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: StudyRoom Live ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            docker-compose.release.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
